  <text x="496" y="149" class="lbl-s" font-family="monospace">  "./skills/sap-fiori-app-development/",  "./skills/sap-fiori-create-cli/", ...</text>
  <text x="496" y="161" class="lbl-s" font-family="monospace">]</text>

