  <text x="139" y="301" class="wht-s" text-anchor="middle">search_docs</text>
  <rect x="248" y="286" width="202" height="22" class="b-dblue" rx="1"/>
  <text x="349" y="301" class="wht-s" text-anchor="middle">list_fiori_apps</text>

  <rect x="38"  y="312" width="202" height="22" class="b-dblue" rx="1"/>
  <text x="139" y="327" class="wht-s" text-anchor="middle">list_sap_systems</text>
