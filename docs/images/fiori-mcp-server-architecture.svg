  <text x="498" y="213" class="lbl-s">SAP Fiori App Development Guidelines (CAP &amp; Standalone Projects)</text>
  <text x="498" y="224" class="lbl-s" fill="#666">How to scaffold, configure, and extend Fiori apps end-to-end</text>

  <!-- skill 2 -->
  <rect x="488" y="234" width="420" height="44" class="b-peach" rx="1"/>
  <text x="498" y="248" class="lbl-s" font-weight="bold">sap-fiori-create-cli</text>
  <text x="498" y="261" class="lbl-s">Fiori Create CLI reference</text>
  <text x="498" y="272" class="lbl-s" fill="#666">CLI commands: create app, update service metadata, convert preview config</text>

  <!-- skill 3 -->
  <rect x="488" y="282" width="420" height="44" class="b-peach" rx="1"/>
  <text x="498" y="296" class="lbl-s" font-weight="bold">sap-fiori-add-visual-filter</text>
  <text x="498" y="309" class="lbl-s">SAP Fiori Visual Filter</text>
  <text x="498" y="320" class="lbl-s" fill="#666">Add visual filters to Fiori Elements Analytical List Page</text>

  <!-- skill 4 -->
  <rect x="488" y="330" width="420" height="44" class="b-peach" rx="1"/>
  <text x="498" y="344" class="lbl-s" font-weight="bold">sap-fiori-analytical-chart</text>
  <text x="498" y="357" class="lbl-s">SAP Fiori Analytical Chart</text>
  <text x="498" y="368" class="lbl-s" fill="#666">Configure analytical charts in Fiori Elements applications</text>

  <!-- skill 5 -->
  <rect x="488" y="378" width="420" height="44" class="b-peach" rx="1"/>
  <text x="498" y="392" class="lbl-s" font-weight="bold">sap-fiori-tree-table</text>
  <text x="498" y="405" class="lbl-s">SAP Fiori Tree Table with Recursive Hierarchy</text>
  <text x="498" y="416" class="lbl-s" fill="#666">RAP &amp; CAP tree tables — read-only, editable, generator-based</text>

  <!-- skill 6 -->
  <rect x="488" y="426" width="420" height="44" class="b-peach" rx="1"/>
  <text x="498" y="440" class="lbl-s" font-weight="bold">sap-fiori-opa5-test-development</text>
  <text x="498" y="453" class="lbl-s">SAP Fiori OPA5 Development Skill</text>
  <text x="498" y="464" class="lbl-s" fill="#666">Write OPA5 tests for Fiori Elements v2 and v4 (journeys, test API)</text>

  <!-- skill 7 -->
  <rect x="488" y="474" width="420" height="44" class="b-peach" rx="1"/>
  <text x="498" y="488" class="lbl-s" font-weight="bold">sap-fiori-eslint-plugin</text>
  <text x="498" y="501" class="lbl-s">SAP Fiori ESLint Plugin</text>
  <text x="498" y="512" class="lbl-s" fill="#666">Lint, migrate, and set up @sap-ux/eslint-plugin-fiori-tools rules</text>

  <!-- "both clients" label -->
  <text x="488" y="534" class="lbl-i">Delivered to Claude Code via .claude-plugin/plugin.json</text>
  <text x="488" y="546" class="lbl-i">Delivered to GitHub Copilot via .github/plugin/plugin.json</text>

  <!-- dashed connector: MCP tools <-> skills (they compose) -->
  <line x1="468" y1="350" x2="488" y2="350" class="arrow-d"/>
  <text x="440" y="344" class="lbl-i" text-anchor="middle">tools +</text>
  <text x="440" y="354" class="lbl-i" text-anchor="middle">skills</text>
  <text x="440" y="364" class="lbl-i" text-anchor="middle">compose</text>


  <!-- ==================================================================
       LEGEND
  ================================================================== -->
  <g transform="translate(18,578)">
    <rect x="0"   y="-11" width="14" height="14" class="b-orange"/>
    <text x="18"  y="1"   class="lbl-s">MCP Server entry-point</text>

    <rect x="152" y="-11" width="14" height="14" class="b-dblue"/>
    <text x="170" y="1"   class="lbl-s">Exposed MCP tool</text>

    <rect x="296" y="-11" width="14" height="14" class="b-grey"/>
    <text x="314" y="1"   class="lbl-s">devDependency (esbuild-bundled)</text>

    <rect x="484" y="-11" width="14" height="14" class="b-peach"/>
    <text x="502" y="1"   class="lbl-s">Skill (SKILL.md loaded into LLM context)</text>

    <rect x="700" y="-11" width="14" height="14" class="b-ltblue"/>
    <text x="718" y="1"   class="lbl-s">LLM client / consumer</text>
  </g>

