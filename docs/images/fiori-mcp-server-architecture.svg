  <text x="349" y="327" class="wht-s" text-anchor="middle">download_odata_metadata</text>

  <rect x="38"  y="338" width="202" height="22" class="b-dblue" rx="1"/>
  <text x="139" y="353" class="wht-s" text-anchor="middle">generate_fiori_app_odata</text>
  <rect x="248" y="338" width="202" height="22" class="b-dblue" rx="1"/>
