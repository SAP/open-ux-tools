  <rect x="38"  y="364" width="202" height="22" class="b-dblue" rx="1"/>
  <text x="139" y="379" class="wht-s" text-anchor="middle">list_functionality</text>
  <rect x="248" y="364" width="202" height="22" class="b-dblue" rx="1"/>
