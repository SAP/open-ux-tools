  <text x="28" y="117" class="lbl" font-weight="bold">.mcp.json  <tspan font-weight="normal" font-style="italic" fill="#555">(MCP server registration)</tspan></text>

  <!-- .mcp.json code snippet -->
  <rect x="28" y="122" width="430" height="58" style="fill:#f5f5f5;stroke:#cccccc;stroke-width:0.5" rx="2"/>
  <text x="36" y="137" class="lbl-s" font-family="monospace">"fiori-mcp": {</text>
  <text x="36" y="149" class="lbl-s" font-family="monospace">  "command": "npx",  "args": ["@sap-ux/fiori-mcp-server", "fiori-mcp"]</text>
  <text x="36" y="161" class="lbl-s" font-family="monospace">}</text>
  <text x="36" y="172" class="lbl-s" fill="#777777">type: stdio  /  timeout: 600s</text>

  <!-- arrow .mcp.json -> fiori-mcp-server package -->
  <line x1="243" y1="180" x2="243" y2="214" class="arrow"/>
  <text x="248" y="199" class="lbl-i">starts via npx</text>

  <!-- @sap-ux/fiori-mcp-server box -->
  <rect x="28" y="216" width="430" height="364" class="box-s" rx="2"/>
  <text x="38" y="231" class="lbl" font-weight="bold">@sap-ux/fiori-mcp-server</text>

  <!-- server entry block -->
  <rect x="130" y="236" width="226" height="28" class="b-orange" rx="1"/>
  <text x="243" y="255" class="wht" font-weight="bold" text-anchor="middle">MCP Server  (server.ts)</text>

