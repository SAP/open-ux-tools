<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="13in"
   height="8.6in"
   viewBox="0 0 936 619"
   xml:space="preserve"
   color-interpolation-filters="sRGB"
   version="1.1"
   id="svg1"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">

  <style type="text/css"><![CDATA[
    .bg       { fill:#ffffff; stroke:none }
    .box-d    { fill:#ffffff; stroke:#000000; stroke-dasharray:3.5,2.5; stroke-linecap:round; stroke-linejoin:round; stroke-width:0.75 }
    .box-s    { fill:none;    stroke:#000000; stroke-dasharray:3.5,2.5; stroke-linecap:round; stroke-linejoin:round; stroke-width:0.5 }
    .lbl      { fill:#000000; font-family:Arial; font-size:9px }
    .lbl-s    { fill:#000000; font-family:Arial; font-size:7px }
    .lbl-i    { fill:#555555; font-family:Arial; font-size:7px; font-style:italic }
    .wht      { fill:#ffffff; font-family:Arial; font-size:8.5px }
    .wht-s    { fill:#ffffff; font-family:Arial; font-size:7px }
    .b-blue   { fill:#548bd4; stroke:#000000; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.4 }
    .b-dblue  { fill:#2a5fa5; stroke:#000000; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.4 }
    .b-grey   { fill:#7f7f7f; stroke:#000000; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.4 }
    .b-ltblue { fill:#c6d8f0; stroke:#000000; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.4 }
    .b-orange { fill:#ea700d; stroke:#000000; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.4 }
    .b-peach  { fill:#fbd7bb; stroke:#000000; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.4 }
    .arrow    { fill:none; stroke:#000000; stroke-width:0.75; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arr) }
    .arrow-d  { fill:none; stroke:#555555; stroke-width:0.6; stroke-dasharray:3,2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arr-g) }
  ]]></style>

  <defs>
    <marker id="arr" orient="auto" markerUnits="strokeWidth" overflow="visible" refX="0" refY="0">
      <path d="M 2,1 0,0 2,-1" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round;stroke-linejoin:round" transform="scale(-5)"/>
    </marker>
    <marker id="arr-g" orient="auto" markerUnits="strokeWidth" overflow="visible" refX="0" refY="0">
      <path d="M 2,1 0,0 2,-1" style="fill:none;stroke:#555555;stroke-width:1;stroke-linecap:round;stroke-linejoin:round" transform="scale(-5)"/>
    </marker>
  </defs>

  <!-- white canvas -->
  <rect x="0" y="0" width="936" height="619" class="bg"/>


  <!-- ==================================================================
       LLM CLIENT  (top, full width)
  ================================================================== -->
  <rect x="120" y="12" width="696" height="52" class="b-ltblue" rx="2"/>
  <text x="468" y="30" class="lbl" font-weight="bold" text-anchor="middle">LLM Client</text>
  <text x="468" y="50" class="lbl" text-anchor="middle">BAS Copilot  /  Claude Code  /  GitHub Copilot  /  Cursor  /  …</text>


  <!-- ==================================================================
       plugins-coding-agents/fiori  OUTER BOX
       This package ships BOTH the MCP server config (.mcp.json) AND the skills
  ================================================================== -->
  <rect x="8" y="80" width="920" height="520" class="box-d" rx="3"/>
  <text x="18" y="95" class="lbl" font-weight="bold">plugins-coding-agents/fiori
    <tspan font-weight="normal" fill="#555555" font-style="italic">  (npm: sap-ux-fiori-tools  —  distributed as a coding-agent plugin)</tspan>
  </text>


  <!-- arrow: LLM -> plugin (MCP) -->
  <line x1="370" y1="64" x2="280" y2="100" class="arrow"/>
  <text x="295" y="86" class="lbl-i" transform="rotate(-18,295,86)">MCP protocol</text>

  <!-- arrow: LLM -> plugin (Skills) -->
  <line x1="566" y1="64" x2="660" y2="100" class="arrow"/>
  <text x="618" y="83" class="lbl-i" transform="rotate(18,618,83)">skill invocation</text>


