  <rect x="306" y="482" width="130" height="20" class="b-grey" rx="1"/>
  <text x="371" y="496" class="wht-s" text-anchor="middle">fiori-annotation-api</text>

  <rect x="38"  y="506" width="130" height="20" class="b-grey" rx="1"/>
  <text x="103" y="520" class="wht-s" text-anchor="middle">annotation-converter</text>
  <rect x="172" y="506" width="130" height="20" class="b-grey" rx="1"/>
  <text x="237" y="520" class="wht-s" text-anchor="middle">logger + telemetry</text>
  <rect x="306" y="506" width="130" height="20" class="b-grey" rx="1"/>
