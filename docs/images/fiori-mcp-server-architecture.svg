  <text x="103" y="472" class="wht-s" text-anchor="middle">store</text>
  <rect x="172" y="458" width="130" height="20" class="b-grey" rx="1"/>
  <text x="237" y="472" class="wht-s" text-anchor="middle">system-access</text>
  <rect x="306" y="458" width="130" height="20" class="b-grey" rx="1"/>
  <text x="371" y="472" class="wht-s" text-anchor="middle">fiori-docs-embeddings</text>

  <rect x="38"  y="482" width="130" height="20" class="b-grey" rx="1"/>
