# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: <%- app.id %>
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
    paths:
      webapp: webapp
customConfiguration:
  adp:
    support:
      id: '<%- customConfig.adp.support.id %>'
      version: <%- customConfig.adp.support.version %>
      toolsId: <%- customConfig.adp.support.toolsId %>
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        # NO component: property for an ADP — the adp block loads base + variant
        ui5Theme: sap_horizon
        adp:
          target:<% if (target?.destination) { %>
            destination: <%- target.destination %><% } else { %>
            client: '<%- target.client %>'
            url: <%- target.url %>
            authenticationType: basic<% } %>
          ignoreCertErrors: false
    - name: fiori-tools-proxy
      afterMiddleware: fiori-tools-preview
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:<% if (target?.destination) { %>
          - destination: <%- target.destination %>
            url: https://REQUIRED_FOR_VSCODE.example<% } else { %>
          - client: '<%- target.client %>'
            url: <%- target.url %>
            authenticationType: basic<% } %>
            path: /sap
        ui5:
          path:
            - /resources
            - /test-resources
          url: <%- ui5.frameworkUrl %>
          version: <%- ui5.version %>
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mockFolder: ./webapp/localService/
        watch: true
        debug: true
      mountPath: /
