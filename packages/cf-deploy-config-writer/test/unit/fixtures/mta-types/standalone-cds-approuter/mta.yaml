_schema-version: "3.3.0"
ID: standaloneCdsApprouter
description: A simple CAP project.
version: 1.0.0
modules:
  - name: standaloneCdsApprouter-srv
    type: nodejs
    path: gen/srv
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
  - name: standaloneCdsApprouter
    type: approuter.nodejs
    path: .deploy/app-router
    requires:
      - name: srv-api
      - name: standaloneCdsApprouter-auth
      - name: standaloneCdsApprouter-destination
      - name: standaloneCdsApprouter-html5-runtime

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

resources:
  - name: standaloneCdsApprouter-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
  - name: standaloneCdsApprouter-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: standaloneCdsApprouter-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
