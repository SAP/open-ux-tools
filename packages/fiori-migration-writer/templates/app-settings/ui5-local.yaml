specVersion: '4.0'
metadata:
  name: '<%= name.toLowerCase() %>'
type: application
framework:
  name: SAPUI5
  version: '<%= localUI5Version %>'
  libraries: <% if (sapUiLibs) { sapUiLibs.forEach(lib => { %>
    - name: <%= lib %><% })} %>
    - name: themelib_<%= ui5Theme %>
server:
  customMiddleware:
  - name: fiori-tools-proxy
    afterMiddleware: compression
    configuration:
      ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
      backend:
      - path: <%= proxyPath %>
        url: <%= proxyHost %><% if(client) { %>
        client: '<%= client %>'<% } %><% if(apiHubApiKey) { %>
        apiHub: true<% } %><% if(scp) { %>
        scp: <%= scp %><% } %><% if(destination) { %>
        destination: <%= destination %><% } %><% if(destinationInstance) { %>
        destinationInstance: <%= destinationInstance %><% } %><% if (locals.generateMockData !== undefined) { %>
  - name: sap-fe-mockserver
    beforeMiddleware: fiori-tools-proxy
    configuration:
      service:
        urlBasePath: <%- servicePath %>
        name: <%- !!locals.serviceName ? serviceName : "''" %>
        metadataXmlPath: <%- metadataXmlPath %>
        mockdataRootPath: <%- mockdataRootPath %>
        generateMockData: <%- generateMockData %><% } %>
  - name: fiori-tools-appreload
    afterMiddleware: compression
    configuration:
     port: 35729
     path: webapp
     delay: 300<% if(appId) { %>
  - name: fiori-tools-preview
    afterMiddleware: fiori-tools-appreload
    configuration:
      component: <%= appId %>
      ui5Theme: <%= ui5Theme %><% } %>
