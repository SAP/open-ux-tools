<!DOCTYPE html>
<html lang="en">
    <head>
        <title>TestSuite for <%- project.title %></title>
        <script type="text/javascript" src="/resources/sap/ui/qunit/qunit-redirect.js"></script>
    </head>
    <body>
        <script language="javascript">
            /**
             * Add test pages to this test suite function.
             * Please order alphabetically
             */
            function suite() {
                var suite = new top.jsUnitTestSuite();
                var contextPath = location.pathname.substring(0, location.pathname.lastIndexOf('/'));
                suite.addTestPage(contextPath + '/testsuite_old.qunit.html');
                return suite;
            }
            redirectToTestrunnerIfRequired();
        </script>
    </body>
</html>
