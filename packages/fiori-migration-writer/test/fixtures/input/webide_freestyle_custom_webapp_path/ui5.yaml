specVersion: "4.0"
metadata:
  name: fin.central.listreport.reuse
type: application
framework:
  name: SAPUI5
  version: snapshot
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.table
    - name: sap.ui.unified
    - name: sap.ushell
    - name: sap.ui.comp
    - name: sap.fe.navigation
    - name: sap.ui.generic.app
    - name: sap.collaboration
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: src/custom/webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: fin.central.listreport.reuse
        ui5Theme: sap_horizon
resources:
  configuration:
    paths:
      webapp: src/custom/webapp
