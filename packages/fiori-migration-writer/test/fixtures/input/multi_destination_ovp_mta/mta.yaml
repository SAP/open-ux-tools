ID: multi_destination_ovp_mta
_schema-version: "2.1"
parameters:
  deploy_mode: html5-repo
version: 0.0.1
modules:
  - name: mta-multi_destination_ovp-approuter
    type: approuter.nodejs
    path: mta-multi_destination_ovp-approuter
    parameters:
      disk-quota: 256M
      memory: 256M
    requires:
      - name: multi_destination_ovp_mta_html5_repo_runtime
      - name: uaa_multi_destination_ovp_mta
      - name: dest_multi_destination_ovp_mta
  - name: multi_destination_ovp_mta_ui_deployer
    type: com.sap.html5.application-content
    path: multi_destination_ovp_mta_ui_deployer
    requires:
      - name: multi_destination_ovp_mta_html5_repo_host
    build-parameters:
      requires:
        - name: multi_destination_ovp
          artifacts:
            - "./*"
          target-path: resources/multi_destination_ovp
  - name: multi_destination_ovp
    type: html5
    path: multi_destination_ovp
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []
      build-result: dist
resources:
  - name: multi_destination_ovp_mta_html5_repo_runtime
    parameters:
      service-plan: app-runtime
      service: html5-apps-repo
    type: org.cloudfoundry.managed-service
  - name: multi_destination_ovp_mta_html5_repo_host
    parameters:
      service-plan: app-host
      service: html5-apps-repo
    type: org.cloudfoundry.managed-service
  - name: uaa_multi_destination_ovp_mta
    parameters:
      path: ./xs-security.json
      service-plan: application
      service: xsuaa
    type: org.cloudfoundry.managed-service
  - name: dest_multi_destination_ovp_mta
    parameters:
      service-plan: lite
      service: destination
    type: org.cloudfoundry.managed-service
