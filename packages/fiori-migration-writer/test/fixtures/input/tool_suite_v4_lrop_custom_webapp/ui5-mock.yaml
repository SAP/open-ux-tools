specVersion: "4.0"
metadata:
  name: namespace3.v4catalog
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp_custom
        delay: 300
resources:
  configuration:
    paths:
      webapp: webapp_custom
