#specific keys+text combination that overwrite template keys+text
#scan the original i18n of the template component for the keys
#you can find it by starting the application in the WebIDE with a run configuration that has unchecked 'open with frame'
#and modify the URL in the browser to /resources/sap/suite/ui/generic/template/<template component name>/i18n/i18n.properties
#<EXISTING_KEY>=<new text for the key>

# XTIT,30: title of the page in ListReport.view.xml, this may be replaced by the application
PAGEHEADER=Record Defects

#XTIT: Success Message Toast after Status Change
MSG_TEXT_ACTION_EXECUTED=Status was updated

#XTIT: Success Message Toast after Status Change
MSG_TEXT_ACTION_NOT_RELEVANT=Defect set to not relevant

#XTIT: Success Message Toast after Status Change
MSG_TEXT_ACTION_SET_IN_PROCESS=Defect set in process

#XTIT: Success Message Toast after Status Change
MSG_TEXT_ACTION_COMPLETE=Defect completed

#XTIT: Success Message Toast after Defect was saved
OBJECT_SAVED=Defect saved

#XTIT, 30:Title of Dialog for Task Creation
CreateTaskDialogTitle=Create Task

#XTIT, 30:Title of Dialog for Edit Creation
EditTaskDialogTitle=Edit Task

#XTIT: Success Message Toast after Task Creation
MSG_TEXT_TASK_CREATED=Task created and saved

#XTIT: Success Message Toast after Task was Edited and Saved
MSG_TEXT_TASK_SAVED=Task saved

#XBUT: Action button to create a new quality tasks (displayed in table toolbar)
ACT_CREATE_TASK=Create

#YMSG: Error Message when Task Creation is not possible because too many tasks exist already
MSG_TEXT_TOO_MANY_TASKS=You cannot create more than one task for this defect.

#YMSG: Error Message when Task Creation is not possible because the defect was never saved
MSG_TEXT_DEFECT_NOT_SAVED=The defect must be saved before you can create a new task.

#YMSG: Error Message Toast if not description was entered for the task
MSG_TEXT_NO_TASK_DET_DESC=Enter a description for the task

#XFLD: Label for QualityTaskProcessorNotes Input Field on 'Edit Task' Dialog
QualityTaskProcessorNotesLabel=Processor Notes

#XFLD: Label for QualityTaskProcessorNotesPreview Read-only Field in the Task Table
QualityTaskProcessorNotesPreviewLabel=Processor Notes Preview

#YMSG: Error Message that is shown when saving a task (create or edit) if the error is not application specific (e.g. communication error)
MSG_TEXT_ERR_TASK_SAVE=Error while saving the task

#YMSG: Is displayed in the task table if not task exists (text is giben by UX Cross Consistency Rules!)
NOITEMS_SMARTTABLE=No items available

#YMSG: Information message that is shown glued to the defect code field in case there were defect code proposals detected while the defect description was entered
MSG_CODE_PROPOSAL_EXIST=Defect code proposals exist

#XBUT: Affected Object Table: Action to add a new affected object (=> add a new line in the table)
AFFECTED_OBJECTS_TABLE_ADD=Add

#XBUT: Affected Object Table: Action to remove an existing affected object (=> remove selected lines from the table)
AFFECTED_OBJECTS_TABLE_REMOVE=Remove

#XBUT: Affected Objects Table: Action to trigger determination of new affected objects (=> call function import C_DefectRecordDetermine_affected_objects of odata service)
AFFECTED_OBJECTS_TABLE_DETERMINE=Determine Affected Objects

#XBUT: Affected Objects Table: Action which marks (selects) one affected object to be the defective one
AFFECTED_OBJECT_SELECT_AS_DEFECTIVE=Select as Defective

#XTIT: Title for menu button for affected objects actions
AFFECTED_OBJECTS_ACTIONS=Follow-Up Actions

#YMSG: Error Message when a action for affected objects is executed but to affected object is selected in the table
AFFECTED_OBJECTS_ACT_REQU_SELECTION=Select at least one affected object to perform the action "{0}"

#YMSG: Message when an action for affected objects is executed but not exactly one line is selected in the table
AFFECTED_OBJECTS_ACT_REQU_SINGLE_SEL=Select exactly one affected object to perform the action "{0}"
