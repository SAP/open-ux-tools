<!DOCTYPE html>
<html>
	<head>
		<title>Unit Tests for Process Quality Tasks (F3250)</title>
		<meta http-equiv='X-UA-Compatible' content='IE=edge'>
		<meta charset="utf-8">
	
		<script id="sap-ui-bootstrap"
				src="../../resources/sap-ui-core.js"
				data-sap-ui-resourceroots='{
				"i2d.qm.defect.records1": "../../",
				"test.unit": "./"
			}'
			data-sap-ui-preload="async">
		</script>
	
		<script>
			/* global QUnit */
			jQuery.sap.require("sap.ui.qunit.qunit-css");
			jQuery.sap.require("sap.ui.thirdparty.qunit");
			jQuery.sap.require("sap.ui.qunit.qunit-junit");
			jQuery.sap.require("sap.ui.qunit.qunit-coverage");
			jQuery.sap.require("sap.ui.thirdparty.sinon-4");
			jQuery.sap.require("sap.ui.qunit.sinon-qunit-bridge");
		
			QUnit.config.autostart = false;
	
			sap.ui.getCore().attachInit(function () {
				sap.ui.require([
					"test/unit/utilities/DefectCategoryDependentUIElements"
				], function() {
					QUnit.start();
				});
			});
		</script>
	</head>
	<body>
		<ol id="qunit-tests"></ol>
		<div id="qunit-fixture"></div>
	</body>
</html>
