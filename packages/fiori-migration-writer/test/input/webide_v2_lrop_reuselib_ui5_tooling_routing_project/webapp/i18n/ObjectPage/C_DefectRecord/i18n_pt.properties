#XTIT: Success Message Toast after Status Change
MSG_TEXT_ACTION_EXECUTED=Status atualizado

#XTIT: Success Message Toast after Status Change
MSG_TEXT_ACTION_NOT_RELEVANT=Defeito n\u00E3o definido como n\u00E3o relevante

#XTIT: Success Message Toast after Status Change
MSG_TEXT_ACTION_SET_IN_PROCESS=Defeito em processamento

#XTIT: Success Message Toast after Status Change
MSG_TEXT_ACTION_COMPLETE=Defeito conclu\u00EDdo

#XTIT: Success Message Toast after Defect was saved
OBJECT_SAVED=Defeito gravado

#XTIT, 30:Title of Dialog for Task Creation
CreateTaskDialogTitle=Criar medida

#XTIT, 30:Title of Dialog for Edit Creation
EditTaskDialogTitle=Processar medida

#XTIT: Success Message Toast after Task Creation
MSG_TEXT_TASK_CREATED=Medida criada e gravada

#XTIT: Success Message Toast after Task was Edited and Saved
MSG_TEXT_TASK_SAVED=Medida gravada

#XBUT: Action button to create a new quality tasks (displayed in table toolbar)
ACT_CREATE_TASK=Criar

#YMSG: Error Message when Task Creation is not possible because too many tasks exist already
MSG_TEXT_TOO_MANY_TASKS=Voc\u00EA n\u00E3o pode criar mais de uma medida para este defeito.

#YMSG: Error Message when Task Creation is not possible because the defect was never saved
MSG_TEXT_DEFECT_NOT_SAVED=O defeito deve ser gravado antes de ser poss\u00EDvel criar uma nova medida.

#YMSG: Error Message Toast if not description was entered for the task
MSG_TEXT_NO_TASK_DET_DESC=Inserir uma descri\u00E7\u00E3o para a medida

#XFLD: Label for QualityTaskProcessorNotes Input Field on 'Edit Task' Dialog
QualityTaskProcessorNotesLabel=Notas do respons\u00E1vel

#XFLD: Label for QualityTaskProcessorNotesPreview Read-only Field in the Task Table
QualityTaskProcessorNotesPreviewLabel=Pr\u00E9-visualiza\u00E7\u00E3o de notas do respons\u00E1vel

#YMSG: Error Message that is shown when saving a task (create or edit) if the error is not application specific (e.g. communication error)
MSG_TEXT_ERR_TASK_SAVE=Erro ao gravar a medida

#YMSG: Is displayed in the task table if not task exists (text is giben by UX Cross Consistency Rules!)
