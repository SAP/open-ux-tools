#XTIT: Title for menu button for affected objects actions
AFFECTED_OBJECTS_ACTIONS=Seuraavat toimet

#YMSG: Error Message when a action for affected objects is executed but to affected object is selected in the table
AFFECTED_OBJECTS_ACT_REQU_SELECTION=Valitse v\u00E4hint\u00E4\u00E4n yksi vaikutuksen alainen objekti, jos haluat suorittaa toimen "{0}"

#YMSG: Message when an action for affected objects is executed but not exactly one line is selected in the table
AFFECTED_OBJECTS_ACT_REQU_SINGLE_SEL=Valitse t\u00E4sm\u00E4lleen yksi vaikutuksen alainen objekti, jos haluat suorittaa toimen "{0}"
