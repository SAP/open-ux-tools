#YMSG: Error Message Toast if not description was entered for the task
MSG_TEXT_NO_TASK_DET_DESC=Sy\u00F6t\u00E4 toimenpiteen kuvaus

#XFLD: Label for QualityTaskProcessorNotes Input Field on 'Edit Task' Dialog
QualityTaskProcessorNotesLabel=K\u00E4sittelij\u00E4n huomautukset

#XFLD: Label for QualityTaskProcessorNotesPreview Read-only Field in the Task Table
QualityTaskProcessorNotesPreviewLabel=K\u00E4sittelij\u00E4n huomautusten esikatselu

#YMSG: Error Message that is shown when saving a task (create or edit) if the error is not application specific (e.g. communication error)
