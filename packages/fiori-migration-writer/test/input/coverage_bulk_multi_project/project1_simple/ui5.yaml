specVersion: "4.0"
metadata:
  name: com.example.bulk.project1
type: application
framework:
  name: SAPUI5
  version: 1.96.0
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.fe.templates
    - name: sap.ushell
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /sap
            url: https://dummy.example.com
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: com.example.bulk.project1
        ui5Theme: sap_fiori_3
