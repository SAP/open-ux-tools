specVersion: "4.0"
metadata:
  name: namespace3.v4catalog
type: application
framework:
  name: SAPUI5
  version: 1.76.0
  libraries:
    - name: sap.ui.core
    - name: sap.fe.templates
    - name: sap.m
    - name: sap.ushell
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: sap-fe-mockserver
      beforeMiddleware: fiori-tools-proxy
      configuration:
        service:
          urlBasePath: /catalog-admin-noauth
          name: ""
          metadataXmlPath: ./webapp_custom/localService/metadata.xml
          mockdataRootPath: ./webapp_custom/localService/mockdata
          generateMockData: true
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp_custom
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: namespace3.v4catalog
        ui5Theme: sap_fiori_3
resources:
  configuration:
    paths:
      webapp: webapp_custom
