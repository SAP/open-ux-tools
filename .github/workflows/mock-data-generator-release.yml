name: Publish @sap-ux/mock-data-generator

# The package ships ONNX models that are not tracked in git. They are built here from public base
# models and the committed row-model adapter, checked against resources/models/manifest.json, and
# only then published. The package stays "private" in the workspace so the shared changesets
# release skips it; this workflow publishes each new version once.

on:
    push:
        branches: [main]
        paths: ['packages/mock-data-generator/package.json']
    workflow_dispatch:
        inputs:
            dry-run:
                description: 'Build and verify the package without publishing'
                type: boolean
                default: true

concurrency:
    group: mock-data-generator-release
    cancel-in-progress: false

jobs:
    publish:
        if: github.repository == 'SAP/open-ux-tools'
        runs-on: ubuntu-latest
        environment: npm-release
        timeout-minutes: 60
        permissions:
            id-token: write
            contents: read
        defaults:
            run:
                working-directory: packages/mock-data-generator
        steps:
            - name: Checkout code repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
            - name: Use Node.js 22.x
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 22.x
                  registry-url: 'https://registry.npmjs.org'
            - name: Setup pnpm
              uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
            - name: Check whether this version is already published
              id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if npm view "@sap-ux/mock-data-generator@$VERSION" version >/dev/null 2>&1; then
                    echo "publish=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "publish=true" >> "$GITHUB_OUTPUT"
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            - name: Setup Python
              if: steps.version.outputs.publish == 'true'
              uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
              with:
                  python-version: '3.12'
            - name: Install model build dependencies
              if: steps.version.outputs.publish == 'true'
              run: |
                  python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
                  python -m pip install -r training/requirements.txt
            - name: Install pnpm modules
              if: steps.version.outputs.publish == 'true'
              working-directory: .
              run: pnpm install --frozen-lockfile
            - name: Build the package
              if: steps.version.outputs.publish == 'true'
              run: pnpm build
            - name: Build and verify the models
              if: steps.version.outputs.publish == 'true'
              run: pnpm build:models --python python
            - name: Verify the packed package
              if: steps.version.outputs.publish == 'true'
              run: pnpm check:package
            - name: Publish to npmjs
              if: steps.version.outputs.publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry-run)
              run: |
                  npm pkg delete private
                  pnpm publish --access public --no-git-checks
