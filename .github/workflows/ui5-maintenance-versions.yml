name: Update UI5 Maintenance Versions

on:
    schedule:
        - cron: '0 2 * * 1' # Every Monday at 02:00 UTC
    workflow_dispatch:
    workflow_call:
        outputs:
            ui5_versions:
                description: Maintained UI5 versions as a JSON array
                value: ${{ jobs.ui5-versions.outputs.ui5_versions }}
jobs:
    ui5-versions:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            ui5_versions: ${{ steps.current-ui5-versions.outputs.versions }}
        steps:
            - name: Checkout code repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0
            - name: Use Node.js 22.x
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 22.x
            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
            - name: Cache pnpm modules
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              env:
                  cache-name: cache-pnpm-modules
              with:
                  path: ~/.pnpm-store
                  key: ubuntu-latest-build-cache-pnpm-modules-22.x-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ubuntu-latest-build-$cache-pnpm-modules-22.x-
            - name: Install pnpm modules
              run: pnpm install --frozen-lockfile
            - name: Run build
              run: pnpm --filter @sap-ux/ui5-info... build
            - name: Load UI5 maintenance versions
              id: current-ui5-versions
              working-directory: tests/integration/adaptation-editor
              run: |
                  pnpm exec node version.js
                  echo "versions=$(cat versions.json)" >> "$GITHUB_OUTPUT"
