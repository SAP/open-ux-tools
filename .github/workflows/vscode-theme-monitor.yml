name: PaletteBot

on:
    schedule:
        # Runs on the 1st of every month at 08:00 UTC
        - cron: '0 8 1 * *'
    workflow_dispatch:

jobs:
    check-themes:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: ci-secrets
        permissions:
            contents: write
            issues: write
            id-token: write

        steps:
            - name: Generate app token
              id: app-token
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Checkout repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
              with:
                  token: ${{ steps.app-token.outputs.token }}

            - name: Use Node.js 22.x
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22.x

            - name: Check for VSCode theme changes
              id: check
              run: |
                  set +e
                  node scripts/check-vscode-themes.mjs
                  EXIT_CODE=$?
                  set -e
                  if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 1 ]; then
                    echo "PaletteBot encountered an error (exit code $EXIT_CODE) — check the logs above" >&2
                    exit 1
                  fi
                  if [ -f "${{ runner.temp }}/theme-diff.json" ]; then
                    echo "diff_file=${{ runner.temp }}/theme-diff.json" >> "$GITHUB_OUTPUT"
                    echo "has_changes=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_changes=false" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  DIFF_OUTPUT: ${{ runner.temp }}/theme-diff.json

            - name: Commit updated vscode_themes.json
              if: steps.check.outputs.has_changes == 'true'
              id: commit
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add design-tokens/vscode_themes.json
                  git commit --no-verify -m "chore: PaletteBot — update vscode_themes.json with upstream theme changes"
                  git push origin HEAD:main
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            # Future: Figma board update step goes here.
            # It should set an output (e.g. figma_status=success|failed) that the comment step can report on.

            - name: Post comment on tracking issue
              if: steps.check.outputs.has_changes == 'true'
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const fs = require('fs');
                      const diffPath = process.env.DIFF_FILE;
                      const report = JSON.parse(fs.readFileSync(diffPath, 'utf8'));
                      const sha = process.env.COMMIT_SHA;
                      const shortSha = sha.slice(0, 7);
                      const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;

                      const TRACKING_LABEL = 'palettebot';
                      const TRACKING_TITLE = 'PaletteBot — VSCode Theme Changes';
                      const ASSIGNEES = ['ux-design-reviewers'];

                      const { data: issues } = await github.rest.issues.listForRepo({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        labels: TRACKING_LABEL,
                        state: 'open',
                        per_page: 1,
                      });

                      let issueNumber;

                      if (issues.length > 0) {
                        issueNumber = issues[0].number;
                      } else {
                        // Create the label if it doesn't exist — only swallow 422 (already exists)
                        try {
                          await github.rest.issues.createLabel({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            name: TRACKING_LABEL,
                            color: '0075ca',
                            description: 'PaletteBot — tracks upstream VSCode theme color changes',
                          });
                        } catch (e) {
                          if (e.status !== 422) throw e;
                        }

                        const { data: newIssue } = await github.rest.issues.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          title: TRACKING_TITLE,
                          labels: [TRACKING_LABEL],
                          assignees: ASSIGNEES,
                          body: [
                            '## 🎨 PaletteBot',
                            '',
                            'This issue tracks upstream color changes from the',
                            '[microsoft/vscode](https://github.com/microsoft/vscode/tree/main/extensions/theme-defaults/themes)',
                            'theme files (2026 Light, 2026 Dark, Monokai, HC Black).',
                            '',
                            'Each comment below is an automated update from PaletteBot. The file',
                            '`design-tokens/vscode_themes.json` in this repo is',
                            'updated automatically when changes are detected.',
                          ].join('\n'),
                        });
                        issueNumber = newIssue.number;
                      }

                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issueNumber,
                        body: `${report.body}\n_Committed: [${context.repo.owner}/${context.repo.repo}@\`${shortSha}\`](${commitUrl})_`,
                      });

                      core.notice(`Posted theme diff to issue #${issueNumber}`);
              env:
                  DIFF_FILE: ${{ steps.check.outputs.diff_file }}
                  COMMIT_SHA: ${{ steps.commit.outputs.sha }}
