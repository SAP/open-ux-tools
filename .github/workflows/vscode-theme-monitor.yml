name: PaletteBot

on:
    schedule:
        # Runs on the 1st of every month at 08:00 UTC
        - cron: '0 8 1 * *'
    workflow_dispatch:

concurrency:
    group: palettebot
    cancel-in-progress: false

jobs:
    check-themes:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: ci-secrets
        permissions:
            contents: write
            issues: write
            id-token: write

        steps:
            - name: Generate app token
              id: app-token
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Checkout repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
              with:
                  token: ${{ steps.app-token.outputs.token }}

            - name: Use Node.js 22.x
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22.x

            - name: Check for VSCode theme changes
              id: check
              run: |
                  set +e
                  node scripts/check-vscode-themes.mjs
                  EXIT_CODE=$?
                  set -e
                  if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 1 ]; then
                    echo "PaletteBot encountered an error (exit code $EXIT_CODE) — check the logs above" >&2
                    exit 1
                  fi
                  if [ -f "$DIFF_OUTPUT" ]; then
                    echo "diff_file=$DIFF_OUTPUT" >> "$GITHUB_OUTPUT"
                    echo "has_changes=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_changes=false" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  DIFF_OUTPUT: ${{ runner.temp }}/theme-diff.json
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Commit updated vscode_themes.json
              if: steps.check.outputs.has_changes == 'true'
              id: commit
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add design-tokens/vscode_themes.json
                  git commit --no-verify -m "chore: PaletteBot — update vscode_themes.json with upstream theme changes"
                  if ! git push; then
                    echo "::error::Failed to push vscode_themes.json update to main. The commit was created locally but could not be pushed."
                    exit 1
                  fi
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Find or create tracking issue
              id: tracking-issue
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const TRACKING_LABEL = 'palettebot';
                      const TRACKING_TITLE = 'PaletteBot — VSCode Theme Changes';

                      const { data: issues } = await github.rest.issues.listForRepo({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        labels: TRACKING_LABEL,
                        state: 'open',
                        per_page: 1,
                      });

                      if (issues.length > 0) {
                        core.setOutput('issue_number', issues[0].number);
                        return;
                      }

                      const { data: newIssue } = await github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: TRACKING_TITLE,
                        labels: [TRACKING_LABEL],
                        body: [
                          '## 🎨 PaletteBot',
                          '',
                          'This issue tracks upstream color changes from the',
                          '[microsoft/vscode](https://github.com/microsoft/vscode/tree/main/extensions/theme-defaults/themes)',
                          'theme files (2026 Light, 2026 Dark, Monokai, HC Black).',
                          '',
                          'Each comment below is an automated update from PaletteBot. The file',
                          '`design-tokens/vscode_themes.json` in this repo is',
                          'updated automatically when changes are detected.',
                          '',
                          '---',
                          '',
                          '## 🔧 Maintenance guide',
                          '',
                          '### Token added with `⚠️ no upstream registerColor`',
                          '',
                          'This means the token exists in VSCode\'s known-variables list but has no `registerColor()` call',
                          'in any of the TypeScript source files that PaletteBot monitors. Its color value will be',
                          'transparent at runtime until VSCode registers it.',
                          '',
                          '**To investigate:**',
                          '1. Take the token name from the report (e.g. `editor-background`)',
                          '2. Convert hyphens to dots: `editor.background`',
                          '3. Search the VSCode repo: https://github.com/search?q=repo%3Amicrosoft%2Fvscode+%22editor.background%22&type=code',
                          '   (replace the token name in the URL)',
                          '4. If a `registerColor(\'token.name\', ...)` call exists, PaletteBot discovers it automatically',
                          '   via GitHub code search on the next run.',
                          '5. If no `registerColor()` exists anywhere, the token has no theme-engine backing.',
                          '   The Figma variable will exist but resolve to transparent at runtime.',
                          '   You can verify in VSCode: open the feature that uses the token, then open its DevTools',
                          '   (`Help > Toggle Developer Tools` — make sure you are on the page/webview where the token appears),',
                          '   then run `getComputedStyle(document.documentElement).getPropertyValue(\'--vscode-token-name\')`.',
                          '   An empty string confirms the property is unset and the element will render transparent.',
                          '   The token will appear in the **All unregistered tokens** list at the bottom of every report.',
                          '',
                          '### Token removed unexpectedly',
                          '',
                          'Tokens are pruned from `vscode_themes.json` when they disappear from VSCode\'s',
                          '[`vscode-known-variables.json`](https://github.com/microsoft/vscode/blob/main/build/lib/stylelint/vscode-known-variables.json).',
                          'This is intentional — the token was renamed or removed upstream.',
                          '',
                          '### Color value looks wrong after an update',
                          '',
                          'PaletteBot resolves values in priority order:',
                          '1. **Theme JSON override** — explicit hex in the theme file (highest priority)',
                          '2. **`registerColor()` default** — parsed from TypeScript source files discovered via GitHub code search',
                          '3. **Transparent** — fallback when neither source has a value',
                          '',
                          'If a value looks wrong, the most likely cause is a cross-file color reference',
                          '(e.g. `registerColor(\'foo\', someOtherToken, ...)`) where `someOtherToken` is defined',
                          'in a file the script failed to fetch. Check the run logs for fetch errors.',
                          '',
                          'If a token keeps showing as unregistered despite a `registerColor()` call existing in the VSCode repo,',
                          'the source file may match one of the exclusion patterns in `TS_SEARCH_EXCLUDES` in',
                          '`scripts/check-vscode-themes.mjs`. Review that list and remove the pattern if it is incorrectly',
                          'excluding a real color source.',
                          '',
                          '@SAP/ux-design-reviewers',
                        ].join('\n'),
                      });
                      core.setOutput('issue_number', newIssue.number);

            - name: Post no-changes comment on tracking issue
              if: steps.check.outputs.has_changes == 'false' && steps.tracking-issue.outcome == 'success'
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const issueNumber = Number('${{ steps.tracking-issue.outputs.issue_number }}');
                      const timestamp = new Date().toISOString().slice(0, 10);
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issueNumber,
                        body: `## 🎨 PaletteBot — ${timestamp}\n\n**No changes** — upstream VSCode theme files are unchanged.\n\n@SAP/ux-design-reviewers`,
                      });
                      core.notice(`Posted no-changes update to issue #${issueNumber}`);

            - name: Post comment on tracking issue
              if: steps.check.outputs.has_changes == 'true' && steps.commit.outcome == 'success' && steps.tracking-issue.outcome == 'success'
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const fs = require('fs');
                      const report = JSON.parse(fs.readFileSync(process.env.DIFF_FILE, 'utf8'));
                      const sha = process.env.COMMIT_SHA;
                      const shortSha = sha ? sha.slice(0, 7) : '(unknown)';
                      const commitUrl = sha
                          ? `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`
                          : null;
                      const issueNumber = Number('${{ steps.tracking-issue.outputs.issue_number }}');

                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issueNumber,
                        body: `${report.body}\n_Committed: ${commitUrl ? `[${context.repo.owner}/${context.repo.repo}@\`${shortSha}\`](${commitUrl})` : shortSha} · [Download vscode_themes.json](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/design-tokens/vscode_themes.json)_\n\n@SAP/ux-design-reviewers`,
                      });
                      core.notice(`Posted theme diff to issue #${issueNumber}`);
              env:
                  DIFF_FILE: ${{ steps.check.outputs.diff_file }}
                  COMMIT_SHA: ${{ steps.commit.outputs.sha }}
